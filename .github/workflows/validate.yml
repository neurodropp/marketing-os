name: Validate framework
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m mos validate
      - run: python scripts/render_processes.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_synthetic_smoke.py --out exports/ci-reference-smoke
      - run: python -m mos export --workflow campaign-launch --out exports/campaign.md
